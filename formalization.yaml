    type: paper
    location: "Problem II.9"
    relationship: background
    author_endorsement: "n/a"
    note: "poses the problem; no result of this source is formalized"
  - title: "Unsolved problems in set theory (Problem 38)"
    authors: ["Paul Erdős", "András Hajnal"]
    id: "Proc. Sympos. Pure Math. XIII, Part I (Axiomatic Set Theory), AMS 1971, 17–48"
    type: paper
    location: "Problem 38 (B)/(C)"
    relationship: background
    author_endorsement: "n/a"
    note: "restates the problem (both questions); no result of this source is formalized"
  - title: "Erdős problem #501 (erdosproblems.com)"
    authors: ["Thomas F. Bloom (ed.)"]
    id: "https://www.erdosproblems.com/501"
    type: "web discussion"
    relationship: background
    author_endorsement: "not-contacted"
    note: >-
      the canonical modern statement of the problem, listed there as open; the formalization's
      hypotheses follow this statement (per-set boundedness, outer measure < 1) and the
      formal-conjectures rendering of it
  - title: "Infinite free set for small measure set mappings"
    authors: ["Ludomir Newelski", "Janusz Pawlikowski", "Wiesław Seredyński"]
    id: "Proc. Amer. Math. Soc. 100 (1987), 335–339"
    type: paper
    relationship: formalizes
    author_endorsement: "not-contacted"
    note: >-
      the closed case: closed sets of Lebesgue measure < 1 admit an infinite independent (free)
      set — targets erdos501_closed_infinite and erdos501_closed_size3 (Erdos501/Closed.lean)
  - title: "Directed graphs over topological spaces: some set theoretical aspects"
    authors: ["Stephen H. Hechler"]
    id: "Israel J. Math. 11 (1972), 231–248"
    type: paper
    relationship: formalizes
    author_endorsement: "n/a"
    note: >-
      the CH counterexample: under CH a family of bounded (countable, null) sets with no infinite
      independent set — target erdos501_hechler_of_CH (Erdos501/Hechler.lean, from ℵ₁ = 𝔠) and,
      inside the collapse extension where CH holds, the direction ¬ (ZFC ⊨ᵇ Erdos501)
      (Flypitch4/Erdos501/Hechler.lean)
  - title: "Erdős Problem 501 after adding ω₂ random reals (draft, revision 10)"
    authors: ["Elliot Glazer", "Sol"]
    id: "docs/paper/erdos501_random_profiles_rev10.pdf (unpublished draft, 2026-08-16)"
    type: paper
    relationship: adapts
    author_endorsement: participated
    note: >-
      the positive answer after adding random reals: the ZFC core (Lemmas 2.1–2.2, Definition 3.1,
      Theorem 3.2: a "profile certificate" yields an infinite independent set), the Δ-system and
      homogeneous-reading arguments, and the fullness of the fresh profiles (Lemma 4.5) are
      formalized as written; the formalized theorem uses the random algebra with 𝔠⁺ coordinates
      over the ground universe (Δ-system for 𝔠⁺ countable sets, no CH in the ground) in place of
      the paper's ω₂ random reals over a CH ground, and the sentence is transferred into the
      Boolean-valued model by an internal-reals argument rather than by re-running the recursion
      in a set model — direction ¬ (ZFC ⊨ᵇ ∼Erdos501) (Flypitch4/Erdos501/*)
  - title: "Some remarks on set theory VIII"
    authors: ["Paul Erdős", "András Hajnal"]
    id: "Michigan Math. J. 7 (1960), 187–191"
    type: paper
    relationship: background
    author_endorsement: "n/a"
    note: "arbitrarily large finite independent sets exist in ZFC (context only; not formalized)"

related_formalizations:
  - id: "https://github.com/flypitch/flypitch"
    relationship: builds-on
    note: >-
      Han–van Doorn, "A formal proof of the independence of the continuum hypothesis" (CPP 2020),
      Lean 3: first-order logic, the theory ZFC, Boolean-valued models, forcing, the completeness
      theorem and the collapse algebra Col(ω₁, 𝒫(ω)) with independence_of_CH.  The vendored
      library Flypitch4/ is derived from it (see below); its axiomatization of ZFC is the one
      mirrored, axiom by axiom, in the Mathlib-side theory of the Challenge
  - id: "https://github.com/ianklatzco/flypitch"
    relationship: builds-on
    note: >-
      Lean 4 port of Flypitch (Ian Klatzco with Claude; commit ad649f8, directory flypitch4/),
      vendored here as Flypitch4/ and forward-ported to the pinned Mathlib, then extended with
      measure algebras, the random algebra and the forcing development for #501
      (Flypitch4/Erdos501/); see third_party/flypitch4/ and docs/PORTING-NOTES.md
  - id: "https://github.com/google-deepmind/formal-conjectures"
    relationship: other
    note: >-
      FormalConjectures/ErdosProblems/501.lean states the first question (answer(sorry)); the
      Mathlib-level statements here (hypotheses, independence predicate) follow it verbatim, and
      the faithfulness target erdos501_sentence_faithful ties the first-order sentence to that
      proposition.  No code is shared; the relationship is "same statement shape"
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: builds-on
    note: >-
      Mathlib.ModelTheory (languages, bounded formulas, structures, Theory.ModelsBoundedFormula,
      Löwenheim–Skolem via Theory.Model.isSatisfiable) is the vocabulary of the Challenge; Mathlib
      measure theory, ZFSet and cardinals supply the rest of the trusted statements

