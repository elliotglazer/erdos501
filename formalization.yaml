  reviewers:
    - "Claude (Anthropic) audit sessions: statements of the seven targets against erdosproblems.com/501 and formal-conjectures (docs/audits/2026-08-16-audit-formal-conjectures-501-statements.md), the paper (docs/audits/2026-08-16-audit-rev10-profile-certificate.md), the vendored port (third_party/flypitch4/), and the forcing development (docs/audits/2026-08-17-erdos501-forcing-audit-355bc1e.txt)"
    - "Elliot Glazer (review of the trusted statements and of the mathematics)"
  notes: >-
    No independent human peer review has been performed yet.  Mechanical checks: lake build of the
    whole repository, #print axioms of every target and of the forcing tree (docs/audits/), and the
    comparator on both configurations (docs/COMPARATOR.md), all at the pinned toolchain
    (Lean v4.34.0-rc1, Mathlib 355bc1e0ed1d36e49525121e1a280ca13a058a92).

alignment:
  namespace: "Erdos501, Erdos501.FOL, Flypitch.Erdos501"
  statements:
    - source: "Newelski–Pawlikowski–Seredyński 1987, main theorem (closed sets of measure < 1 admit an infinite free set)"
      lean: "erdos501_closed_infinite (Erdos501.erdos501_pairwise)"
      module: "Solution.lean (Erdos501/Closed.lean)"
      status: proved
    - source: "Erdős #501, second question (independent set of size 3)"
      lean: "erdos501_closed_size3 (Erdos501.erdos501_ncard_three)"
      module: "Solution.lean (Erdos501/Closed.lean)"
      status: proved
    - source: "Hechler 1972 (CH counterexample)"
      lean: "erdos501_hechler_of_CH (Erdos501.hechler_of_CH)"
      module: "Solution.lean (Erdos501/Hechler.lean)"
      status: proved
    - source: "Glazer 2026, Theorem 1.1 (positive answer after adding random reals): consistency of a positive answer"
      lean: "erdos501_not_refutable (Erdos501.FOL.erdos501_not_refutable ← Flypitch.Erdos501.neg_Erdos501_f_unprovable ← erdos501_of_random)"
      module: "Solution.lean (Erdos501/FOL/Independence.lean, Flypitch4/Erdos501/Main.lean)"
      status: proved
    - source: "Hechler 1972 inside the collapse extension: consistency of a negative answer"
      lean: "erdos501_not_provable (Erdos501.FOL.erdos501_not_provable ← Flypitch.Erdos501.Hechler.Erdos501_f_unprovable ← neg_erdos501_forced_collapse)"
      module: "Solution.lean (Erdos501/FOL/Independence.lean, Flypitch4/Erdos501/Hechler.lean)"
      status: proved
    - source: "Independence of the first question from ZFC"
      lean: "erdos501_independent"
      module: "Solution.lean (Erdos501/FOL/Independence.lean)"
      status: proved
    - source: "Faithfulness of the first-order rendering (formal-conjectures statement)"
      lean: "erdos501_sentence_faithful (Erdos501.FOL.realize_Erdos501_iff ← Flypitch.Erdos501.stdStructure_realize_Erdos501_f_iff)"
      module: "Solution.lean (Erdos501/FOL/Sentence.lean, Flypitch4/Erdos501/Bridge.lean)"
      status: proved

