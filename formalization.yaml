automation:
  methods:
    - method: agent
      models:
        - "Claude (Anthropic); the final integration and the Mathlib ModelTheory bridge (Erdos501/FOL/, Challenge.lean, Solution.lean) were produced by claude-fable-5"
      framework: "Claude (Anthropic) agent sessions — Claude Cowork / Claude Code"
      tool_setup: >-
        Agent sessions in a claude.ai project ("Formalizing Erdős 501"), each with a Lean 4 toolchain
        and a Mathlib build; the sessions wrote all Lean code (the Mathlib-level proofs, the port of
        the Flypitch library to the pinned Mathlib, the measure/random-algebra additions, the forcing
        development for #501, and the bridge to Mathlib's first-order logic), ran lake, the axiom
        audits and the comparator, and wrote the documentation.  Mathematical direction, the choice
        of what to formalize, the paper being formalized (Glazer 2026) and the review of the
        statements were the human author's.
      cost:
        wall_time: "August 2026, about a week of agent sessions"
        spend_usd: "subscription-based usage"
        hardware: "API-only (cloud sandboxes with a Lean toolchain)"
      prompting_notes: >-
        Task-level natural-language instructions (formalize unit F3, port the library, make the
        Challenge Mathlib-only, …); the plans and audit notes are kept as project documents and, in
        part, under docs/ (docs/PORTING-NOTES.md, docs/audits/, docs/PROVENANCE.md).
    - method: manual
      tool_setup: >-
        Elliot Glazer: the mathematics (the paper docs/paper/erdos501_random_profiles_rev10.pdf,
        the choice of route through Flypitch's Boolean-valued models, the axiomatization), review of
        the trusted statements, repository administration.
  spend_usd: "subscription-based usage"
  notes: >-
    Full disclosure: every line of Lean in this repository was written by AI agents (Claude) under
    the direction of the human author; no line was written by hand.  Exact model identifiers for
    the earlier sessions were not recorded in the repository.  The Lean 4 port of Flypitch that is
    vendored (Flypitch4/) was itself produced with Claude by Ian Klatzco.  All proofs are checked
    by Lean's kernel; the comparator (leanprover/comparator) accepts both challenge configurations
    with the standard axioms only, and no declaration in the repository depends on sorryAx
    (docs/audits/, docs/STATUS.md).

fidelity:
  divergences: >-
    (1) Independence is proved for the first-order sentence Erdos501 ("every complete ordered
    field has the Erdős property"), i.e. for the first question rendered inside ZFC; the target
    erdos501_sentence_faithful certifies that in Mathlib's ZFSet this sentence is equivalent to the
    Mathlib statement of the first question, so nothing weaker is being claimed.  Inside the
    sentence, "outer measure < 1" is rendered as the existence of a cover by countably many open
    intervals of total length < 1 (the definition of Lebesgue outer measure), "bounded" as bounded
    above and below, "infinite" as "ω injects into X".  (2) The theory ZFC is Flypitch's
    axiomatization (extensionality, empty set, ordered pairs, union, power set, infinity,
    regularity, Zorn's lemma, strong collection), which is equivalent to the usual ZFC.  (3)
    Independence is stated semantically (Mathlib has no proof calculus): ¬ (ZFC ⊨ᵇ φ) means that
    some model of ZFC (with carrier in Type 0; by Löwenheim–Skolem this is no restriction)
    satisfies ¬φ.  The underlying Flypitch results are the syntactic ¬ (ZFC ⊢ₛ' Erdos501_f) and
    ¬ (ZFC ⊢ₛ' ∼Erdos501_f) (comparator-flypitch.json).  (4) The consistency of a positive answer
    is obtained from the random algebra with 𝔠⁺ coordinates over the ground universe rather than
    from ω₂ random reals over a model of CH as in the paper (the paper's two-step Col × Random
    forcing is not used; the Δ-system lemma for 𝔠⁺ countable sets needs no CH).  (5) CH in
    erdos501_hechler_of_CH is (ℵ₁ : Cardinal.{u}) = 𝔠.  (6) erdos501_closed_size3 states "size 3"
    as 3 ≤ X.ncard (Set.ncard is 0 on infinite sets, so this is a finite independent set with at
    least three elements); erdos501_closed_infinite gives the infinite one, without any
    boundedness hypothesis.

