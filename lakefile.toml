# Erdős Problem #501 — Lean 4 formalization
#
#   * Erdos501          : the mathematical development (closed case, Hechler's
#                         CH counterexample, ZFC core of the random-reals
#                         argument, assembly, and the bridge to the Mathlib
#                         first-order logic used by the Challenge)
#   * Flypitch4         : vendored Lean 4 port of Flypitch (Han–van Doorn) —
#                         first-order logic, ZFC, Boolean-valued models, forcing —
#                         plus the measure/random-algebra additions and the
#                         forcing development for #501 (Flypitch4/Erdos501/)
#   * Challenge         : trusted statements for the comparator (sorried);
#                         imports Mathlib only (Palomar-conformant)
#   * Solution          : the same statements, proved by delegation
#   * ChallengeFlypitch : the same results stated in Flypitch's proof-theoretic
#                         terms (`independent ZFC Erdos501_f`); imports Flypitch4
#   * SolutionFlypitch  : its solution
#
# The comparator (https://github.com/leanprover/comparator) is driven by
# comparator.json (Challenge/Solution) and comparator-flypitch.json
# (ChallengeFlypitch/SolutionFlypitch).

name = "erdos501"
version = "0.1.0"
defaultTargets = ["Flypitch4", "Erdos501", "Challenge", "Solution", "ChallengeFlypitch", "SolutionFlypitch"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "355bc1e0ed1d36e49525121e1a280ca13a058a92"

# The Flypitch port predates the autoImplicit=false convention; keep Lean's
# default there and be strict everywhere else.
[[lean_lib]]
name = "Flypitch4"

[[lean_lib]]
name = "Erdos501"
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "Challenge"
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "Solution"
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "ChallengeFlypitch"
leanOptions = { autoImplicit = false }

[[lean_lib]]
name = "SolutionFlypitch"
leanOptions = { autoImplicit = false }
